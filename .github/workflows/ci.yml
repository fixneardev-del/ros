name: Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Secret scan
        run: |
          if git grep -nE '(re_[A-Za-z0-9]{20,}|sb_secret_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,})' -- .; then
            echo "A credential-shaped value was found in a tracked file."
            exit 1
          fi
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build

  rls:
    name: Row level security suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start local Supabase and load the schema and seed
        run: |
          npx supabase start
          npx supabase db reset
      - name: Run the RLS suite
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run test:rls

  e2e:
    name: End to end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The suite signs in, posts jobs and sends offers, so it needs a real
      # database. The Supabase CLI gives it one that matches production.
      - name: Start the local Supabase stack
        run: |
          npx supabase start
          npx supabase db reset
      - name: Load the demo accounts and content
        env:
          PGPORT: "54322"
          PGPASSWORD: postgres
          DB: postgres
        run: ./scripts/local-demo-data.sh
      # `e2e-server.mjs` uses these instead of starting a stack of its own.
      - name: Read the stack keys
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
